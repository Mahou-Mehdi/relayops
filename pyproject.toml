[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relayops"
version = "0.2.0"
description = "Evidence-led enterprise agent investigation, supervised recovery, and verified transform repair."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mahou Mehdi"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "langgraph>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
relayops = "relayops.cli:main"

[tool.setuptools.packages.find]
include = ["relayops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
